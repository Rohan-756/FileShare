<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js" defer></script>
</head>

<body class="min-h-screen flex flex-col font-sans antialiased text-slate-100 bg-cover bg-center bg-no-repeat bg-fixed"
      style="background-image:url('./assets/background.jpg');">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    FS
                </div>
                <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    FileShare
                </span>
            </div>
            <div id="connection-badge" class="flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span>Connecting to server...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6 justify-center">

        <!-- Room Card -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
            <div class="text-center max-w-md mx-auto">
                <h1 class="text-2xl font-bold text-white tracking-tight">Peer-to-Peer Pairing</h1>
                <p class="text-sm text-slate-400 mt-1">Scan the QR code or share the room link to connect another peer
                    directly.</p>
            </div>

            <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-8">
                <!-- QR Code Container -->
                <div
                    class="bg-white p-3 rounded-xl shadow-inner border border-slate-200 flex items-center justify-center min-w-[160px] min-h-[160px]">
                    <div id="qrcode"></div>
                </div>

                <!-- Room Information & Share Link -->
                <div class="flex flex-col gap-4 w-full sm:w-auto">
                    <div>
                        <label class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Room Code</label>
                        <div id="room-code-display"
                            class="text-3xl font-mono font-extrabold text-indigo-400 tracking-widest mt-0.5">
                            ------
                        </div>
                    </div>

                    <div>
                        <label class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Shareable
                            Link</label>
                        <div class="flex items-center gap-2 mt-1">
                            <input id="share-url-input" type="text" readonly
                                class="bg-slate-900 text-xs text-slate-300 px-3 py-2 rounded-lg border border-slate-700 focus:outline-none w-64 select-all font-mono"
                                value="Generating..." />
                            <button id="btn-copy-link"
                                class="bg-indigo-600 min-w-[90px] hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition-colors flex items-center justify-center gap-1 shadow-md shadow-indigo-600/20 active:scale-95">
                                Copy Link
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Peers & Connection Status -->
<section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
  <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 text-center">
    Transfer Room Participants
  </h2>
  
  <!-- Forced 2-column layout across all screen sizes (grid-cols-2) -->
  <div id="peers-list" class="grid grid-cols-2 gap-3 sm:gap-6">
    <!-- Waiting placeholder -->
    <div id="peer-placeholder" class="col-span-2 py-8 text-center text-slate-500 border border-dashed border-slate-700/80 rounded-xl">
      Waiting for second peer to join room...
    </div>
  </div>
</section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500">
        Zero-Trust WebRTC P2P Transfer Engine — E2E Encrypted
    </footer>

</body>

</html>
